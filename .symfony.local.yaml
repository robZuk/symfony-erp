# Background processes started together with `symfony server:start`
workers:
    tailwind:
        cmd: ['symfony', 'console', 'tailwind:build', '--watch']
    # The same transports as the worker in Kubernetes: every one but "failed" (PDFs and e-mails, the outbox relay, subscribed events)
    messenger:
        cmd: ['symfony', 'console', 'messenger:consume', '--all', '--exclude-receivers=failed', '--time-limit=3600']
