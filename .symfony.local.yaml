# Background processes started together with `symfony server:start`
workers:
    tailwind:
        cmd: ['symfony', 'console', 'tailwind:build', '--watch']
    # The same transports as the worker in Kubernetes: PDFs and e-mails, then the outbox relay, then subscribed events
    messenger:
        cmd: ['symfony', 'console', 'messenger:consume', 'async', 'outbox', 'events', '--time-limit=3600']
