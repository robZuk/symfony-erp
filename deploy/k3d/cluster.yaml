# Local Kubernetes cluster for trying the deployment: `k3d cluster create --config deploy/k3d/cluster.yaml`
# k3d runs k3s (the distribution used on the production server) inside Docker, so the cluster
# has the same ingress controller (Traefik) and the same storage class (local-path).
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
    name: system-erp
servers: 1
agents: 0
image: rancher/k3s:v1.35.5-k3s1
ports:
    # Traefik answers on port 80 of the cluster; the app is reachable at http://system-erp.localhost:8088
    - port: 8088:80
      nodeFilters:
          - loadbalancer
options:
    k3s:
        extraArgs:
            # Docker hands out container IPs in start order, so after a host reboot the node can come back
            # with a different IP than the one stored in the cluster. k3s's network policy controller then
            # cannot find the stored IP, shuts k3s down and the container restarts in a loop. The chart
            # defines no NetworkPolicy, so the controller has nothing to enforce here.
            - arg: --disable-network-policy
              nodeFilters:
                  - server:*
