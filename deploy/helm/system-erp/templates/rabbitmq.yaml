{{- $component := dict "component" "rabbitmq" "Release" .Release -}}
# Broker of the business events (exchange "erp.events"): <release>-rabbitmq:5672
apiVersion: v1
kind: Service
metadata:
  name: {{ include "system-erp.rabbitmqHost" . }}
  labels:
    {{- include "system-erp.labels" . | nindent 4 }}
    app.kubernetes.io/component: rabbitmq
spec:
  selector:
    {{- include "system-erp.selector" $component | nindent 4 }}
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
---
# A StatefulSet: RabbitMQ names its data directory after the host name, which must stay the same,
# and the queues are kept on the pod's own disk, so messages waiting for a subscriber survive a restart
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-rabbitmq
  labels:
    {{- include "system-erp.labels" . | nindent 4 }}
    app.kubernetes.io/component: rabbitmq
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  serviceName: {{ include "system-erp.rabbitmqHost" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "system-erp.selector" $component | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "system-erp.selector" $component | nindent 8 }}
    spec:
      securityContext:
        # The rabbitmq image runs as user 999; the disk is made writable for that group
        fsGroup: 999
        # Only when the disk is mounted for the first time. By default Kubernetes makes every file
        # group-accessible on each mount, and RabbitMQ refuses to start when its .erlang.cookie is
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: rabbitmq
          # The image without the management plugin, which would cost about 100 MB of memory;
          # in production the queues are looked at with: kubectl exec … -- rabbitmqctl list_queues
          image: {{ .Values.rabbitmq.image }}
          # The Erlang cookie must be readable by its owner only; this also repairs a disk whose
          # permissions were widened before fsGroupChangePolicy was set
          command:
            - sh
            - -c
            - chmod 600 /var/lib/rabbitmq/.erlang.cookie 2>/dev/null; exec docker-entrypoint.sh rabbitmq-server
          ports:
            - name: amqp
              containerPort: 5672
          env:
            # Created on the first start, with an empty disk; later changes need rabbitmqctl change_password
            - name: RABBITMQ_DEFAULT_USER
              value: {{ .Values.rabbitmq.user }}
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: RABBITMQ_PASSWORD
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "check_port_connectivity"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            {{- toYaml .Values.rabbitmq.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.rabbitmq.size }}
