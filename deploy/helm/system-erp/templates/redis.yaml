{{- $component := dict "component" "redis" "Release" .Release -}}
# Cache, sessions and login throttling counts: <release>-redis:6379
apiVersion: v1
kind: Service
metadata:
  name: {{ include "system-erp.redisHost" . }}
  labels:
    {{- include "system-erp.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  selector:
    {{- include "system-erp.selector" $component | nindent 4 }}
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
# A StatefulSet with its own disk: sessions live here, so a restart must not sign everybody out
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-redis
  labels:
    {{- include "system-erp.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  serviceName: {{ include "system-erp.redisHost" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "system-erp.selector" $component | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "system-erp.selector" $component | nindent 8 }}
    spec:
      securityContext:
        # The redis image runs as user 999; the disk is made writable for that group
        fsGroup: 999
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          # --appendonly: every write goes to disk, so sessions survive a restart.
          # --maxmemory-policy volatile-lru: when memory runs out, only entries with an expiry are evicted;
          # the tag-aware cache of Symfony needs that (its tag lists have no expiry and must not vanish).
          command:
            - sh
            - -c
            - exec redis-server --requirepass "$REDIS_PASSWORD" --appendonly yes --maxmemory {{ .Values.redis.maxMemory }} --maxmemory-policy volatile-lru
          ports:
            - name: redis
              containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: REDIS_PASSWORD
            # Read by redis-cli in the probes, so the password is not on the command line
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: REDIS_PASSWORD
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.redis.size }}
