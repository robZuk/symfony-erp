{{- if and .Values.monitoring.enabled (not .Values.monitoring.grafanaCloud.enabled) }}
{{- $component := dict "component" "prometheus" "Release" .Release -}}
# Full Prometheus for local clusters: stores the data and evaluates the alert rules, Grafana shows it
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-prometheus
  labels:
    {{- include "system-erp.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
data:
  prometheus.yml: |
    global:
      # Rarely, because the server has one CPU; enough to see trends and outages
      scrape_interval: {{ .Values.monitoring.prometheus.scrapeInterval }}
      evaluation_interval: {{ .Values.monitoring.prometheus.scrapeInterval }}
    rule_files:
      - /etc/prometheus/alerts.yml
    {{- include "system-erp.scrapeConfigs" . | nindent 4 }}
  alerts.yml: |
{{ .Files.Get "files/prometheus-alerts.yml" | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-prometheus
  labels:
    {{- include "system-erp.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
spec:
  selector:
    {{- include "system-erp.selector" $component | nindent 4 }}
  ports:
    - name: http
      port: 9090
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-prometheus
  labels:
    {{- include "system-erp.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
  annotations:
    # After the app, so a problem here never holds back a new version of it
    argocd.argoproj.io/sync-wave: "2"
spec:
  serviceName: {{ .Release.Name }}-prometheus
  replicas: 1
  selector:
    matchLabels:
      {{- include "system-erp.selector" $component | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "system-erp.selector" $component | nindent 8 }}
      annotations:
        # Changed alert rules restart the pod
        checksum/alerts: {{ .Files.Get "files/prometheus-alerts.yml" | sha256sum }}
    spec:
      serviceAccountName: {{ .Release.Name }}-prometheus
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: prometheus
          image: {{ .Values.monitoring.prometheus.image }}
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time={{ .Values.monitoring.prometheus.retention }}
            # Below the size of the disk: old data goes first, the disk never fills up
            - --storage.tsdb.retention.size={{ .Values.monitoring.prometheus.retentionSize }}
          env:
            # Go gives memory back before the limit is reached, instead of the pod being killed at it
            - name: GOMEMLIMIT
              value: {{ .Values.monitoring.prometheus.goMemLimit }}
          ports:
            - name: http
              containerPort: 9090
          startupProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml .Values.monitoring.prometheus.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-prometheus
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.monitoring.prometheus.size }}
{{- end }}
