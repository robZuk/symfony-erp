{{- $component := dict "component" "postgres" "Release" .Release -}}
# Stable address of the database inside the cluster: <release>-postgres:5432
apiVersion: v1
kind: Service
metadata:
  name: {{ include "system-erp.postgresHost" . }}
  labels:
    {{- include "system-erp.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  selector:
    {{- include "system-erp.selector" $component | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
# A StatefulSet, not a Deployment: the pod keeps its name and its own disk across restarts
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-postgres
  labels:
    {{- include "system-erp.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  annotations:
    # Argo CD creates the database before everything else (lower waves go first)
    argocd.argoproj.io/sync-wave: "-1"
spec:
  serviceName: {{ include "system-erp.postgresHost" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "system-erp.selector" $component | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "system-erp.selector" $component | nindent 8 }}
    spec:
      securityContext:
        # The postgres image runs as user 70 (alpine); the disk is made writable for that group
        fsGroup: 70
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: POSTGRES_PASSWORD
            # A subdirectory, because the root of a fresh volume may contain lost+found
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          # Ready = accepts connections; until then the Service sends it no traffic
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U {{ .Values.postgres.user }} -d {{ .Values.postgres.database }}"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U {{ .Values.postgres.user }} -d {{ .Values.postgres.database }}"]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  # One disk per pod, created on first start and kept when the pod (or the chart) is removed
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.size }}
