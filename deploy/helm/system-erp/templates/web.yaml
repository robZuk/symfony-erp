{{- $component := dict "component" "web" "Release" .Release -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-web
  labels:
    {{- include "system-erp.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      {{- include "system-erp.selector" $component | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Start one new pod before stopping an old one, and never drop below the full count:
      # an update causes no downtime
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "system-erp.selector" $component | nindent 8 }}
    spec:
      securityContext:
        # Mounted disks become writable for the app user's group
        fsGroup: 1000
      initContainers:
        {{- include "system-erp.waitForServices" . | nindent 8 }}
        {{- include "system-erp.waitForMigrations" . | nindent 8 }}
      containers:
        - name: web
          image: {{ include "system-erp.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            {{- include "system-erp.appEnv" . | nindent 12 }}
            # A fixed number of PHP workers, each a copy of the application in memory: FrankenPHP would
            # otherwise start two per CPU core it sees, and in a container that is the whole node's
            - name: FRANKENPHP_CONFIG
              value: "worker ./public/index.php {{ .Values.web.phpWorkers }}"
          # The login page is public and touches PHP, Twig and the session table:
          # if it answers, the app works
          # Generous timeouts: on the single CPU of the production server a busy moment (another pod
          # starting) slows answers down for a while. The default timeout of 1 s then restarted both web
          # pods at once and took the site down. Liveness is for a hung process, not a slow one.
          readinessProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          securityContext:
            {{- include "system-erp.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - name: invoices
              mountPath: /app/var/invoices
      volumes:
        - name: invoices
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-invoices
---
# Stable address of the web pods; traffic is spread over the ready ones
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-web
  labels:
    {{- include "system-erp.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  selector:
    {{- include "system-erp.selector" $component | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Route from the outside world: requests for the host go to the web Service.
# Served by Traefik, the ingress controller built into k3s.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-web
  labels:
    {{- include "system-erp.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  rules:
    - host: {{ .Values.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-web
                port:
                  name: http
