# Builds the product search index when Elasticsearch has none (the first deployment, or after its disk
# was lost). On every later deployment it finds the index and does nothing; day-to-day changes reach the
# index through ProductChanged events.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-search-index
  labels:
    {{- include "system-erp.labels" . | nindent 4 }}
    app.kubernetes.io/component: search-index
  annotations:
    # After everything else is up: the migrations have run and Elasticsearch exists
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        {{- include "system-erp.selector" (dict "component" "search-index" "Release" .Release) | nindent 8 }}
    spec:
      restartPolicy: Never
      initContainers:
        {{- include "system-erp.waitForElasticsearch" . | nindent 8 }}
      containers:
        - name: search-index
          image: {{ include "system-erp.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["php", "bin/console", "app:search:reindex", "--if-missing"]
          env:
            {{- include "system-erp.appEnv" . | nindent 12 }}
          securityContext:
            {{- include "system-erp.containerSecurity" . | nindent 12 }}
