# Default settings. Each environment overrides what differs in its own file
# (values-k3d.yaml for the local cluster, values-mikrus.yaml for production).

image:
    repository: ghcr.io/robzuk/symfony-erp
    tag: latest
    # IfNotPresent: download the image only when the node does not have this tag yet
    pullPolicy: IfNotPresent

# Address of the application, used by the Ingress and for links in e-mails
host: system-erp.localhost
# Scheme seen by the browser; "https" when TLS is terminated in front of the cluster
scheme: http

ingress:
    # Extra annotations for the Ingress, e.g. Traefik middlewares an environment needs
    annotations: {}

# Secret with APP_SECRET, POSTGRES_PASSWORD, REDIS_PASSWORD, RABBITMQ_PASSWORD and MAILER_DSN. It is not created by this chart,
# so no password ever lands in values files: locally it is made with kubectl, in production
# it comes from a SealedSecret.
existingSecret: system-erp

# Proxies whose X-Forwarded-* headers are trusted: Traefik runs in the pod network of k3s
trustedProxies: "127.0.0.1,10.42.0.0/16"

# Storage class for all disks; empty means the cluster default (local-path in k3s)
storageClassName: ""

web:
    # Two copies, so one keeps serving while the other is replaced during an update
    replicas: 2
    # PHP workers per pod. Measured with k6 (docs/wydajnosc.md): 4 workers serve about 1000 requests a
    # second at about 100 MB, within the memory limit below
    phpWorkers: 4
    # Seconds a stopping pod keeps serving, until kube-proxy and Traefik no longer send it requests
    # (measured on k3d, docs/wdrozenie.md)
    shutdownDelaySeconds: 10
    resources:
        requests:
            cpu: 50m
            memory: 128Mi
        limits:
            memory: 256Mi

worker:
    replicas: 1
    resources:
        requests:
            cpu: 25m
            memory: 96Mi
        limits:
            memory: 256Mi

# Generated invoice PDFs, shared by the web pods (download) and the worker (generation)
invoices:
    size: 1Gi

postgres:
    image: postgres:16-alpine
    database: app
    user: app
    size: 5Gi
    resources:
        requests:
            cpu: 50m
            memory: 128Mi
        limits:
            memory: 384Mi

redis:
    image: redis:8-alpine
    # Above this, entries with an expiry (cache, sessions) are evicted, least recently used first
    maxMemory: 64mb
    size: 256Mi
    resources:
        requests:
            cpu: 10m
            memory: 32Mi
        limits:
            memory: 128Mi

rabbitmq:
    # Without the management plugin, to save memory
    image: rabbitmq:4-alpine
    user: erp
    size: 1Gi
    resources:
        requests:
            cpu: 25m
            memory: 160Mi
        limits:
            memory: 384Mi

backup:
    enabled: true
    # Every night at 02:30 (time zone of the cluster, UTC on k3s)
    schedule: "30 2 * * *"
    # Dumps older than this are removed
    keepDays: 7
    size: 2Gi

# Prometheus, Grafana and two exporters. On their own (local clusters) about 400 MB of memory plus page
# cache and 1 GB of disk, so off by default. With grafanaCloud only Prometheus in agent mode and the
# exporters run here. CPU limits, because monitoring must not take the only CPU away from the app.
monitoring:
    enabled: false
    # Send the metrics to Grafana Cloud instead of keeping and showing them in the cluster
    grafanaCloud:
        enabled: false
        # From the Prometheus tile of the Grafana Cloud stack ("Details")
        remoteWriteUrl: ""
        username: ""
        # Secret with the access policy token (scope metrics:write) under the key "token"
        existingSecret: grafana-cloud
        cluster: ""
        sentMetrics:
            - up
            - traefik_service_requests_total
            - traefik_service_request_duration_seconds_bucket
            - frankenphp_busy_workers
            - frankenphp_queue_depth
            - frankenphp_total_workers
            - rabbitmq_queue_messages
            - pg_up
            - pg_stat_activity_count
            - pg_stat_user_tables_n_live_tup
            - redis_up
            - redis_memory_used_bytes
            - container_cpu_usage_seconds_total
            - container_memory_working_set_bytes
            - container_spec_memory_limit_bytes
    prometheus:
        image: prom/prometheus:v3.15.1
        scrapeInterval: 30s
        retention: 7d
        retentionSize: 700MB
        size: 1Gi
        goMemLimit: 200MiB
        resources:
            requests:
                cpu: 25m
                memory: 96Mi
            limits:
                cpu: 200m
                memory: 256Mi
    grafana:
        image: grafana/grafana:13.3.0
        # The limit also covers the page cache of its 490 MB binary. At 400 MiB on production the binary was
        # read from disk again and again (17 GB in 5 minutes) and Grafana never finished starting
        goMemLimit: 320MiB
        resources:
            requests:
                cpu: 25m
                memory: 256Mi
            limits:
                cpu: 300m
                memory: 768Mi
    exporters:
        postgresImage: prometheuscommunity/postgres-exporter:v0.20.1
        redisImage: oliver006/redis_exporter:v1.96.0
        # For each of the two
        resources:
            requests:
                cpu: 5m
                memory: 16Mi
            limits:
                cpu: 50m
                memory: 48Mi
