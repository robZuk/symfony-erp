# Production: k3s on the Mikrus server eve250, behind the Mikrus subdomain proxy (Cloudflare).
# The Secret named in existingSecret comes from deploy/mikrus/system-erp-secret.yaml (a SealedSecret).
image:
    # The image CI built from this commit; a fixed tag, so the cluster runs a known version
    tag: 1224051
    pullPolicy: IfNotPresent

host: systemerp.tojest.dev
# The browser talks HTTPS to Cloudflare, which forwards plain HTTP to the server
scheme: https

ingress:
    annotations:
        # The Mikrus proxy reports X-Forwarded-Proto: http even for HTTPS visitors;
        # this middleware from deploy/mikrus/https.yaml corrects it (<namespace>-<name>@kubernetescrd)
        traefik.ingress.kubernetes.io/router.middlewares: system-erp-mikrus-https@kubernetescrd

# Off for now: on the single CPU of this server Elasticsearch took longer to start than its liveness
# probe allowed, restarted in a loop and starved everything else (docs/wdrozenie.md). Search uses PostgreSQL.
elasticsearch:
    enabled: false
