name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    ci:
        runs-on: ubuntu-latest
        services:
            database:
                image: postgres:16-alpine
                env:
                    POSTGRES_DB: app
                    POSTGRES_USER: app
                    POSTGRES_PASSWORD: '!ChangeMe!'
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -d app -U app"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        env:
            DATABASE_URL: 'postgresql://app:!ChangeMe!@127.0.0.1:5432/app?serverVersion=16&charset=utf8'
        steps:
            - uses: actions/checkout@v4
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'
                  extensions: intl, pdo_pgsql, redis, amqp
                  coverage: none
            - run: composer install --no-interaction --no-progress
            - run: make lint CONSOLE="php bin/console" PHP=php
            - run: make test CONSOLE="php bin/console" PHP=php

    # Container image for the cluster, published only for commits on main that passed the checks.
    # Each image is tagged with the commit it was built from, so a deployment names an exact version.
    image:
        needs: ci
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v4
            - uses: docker/setup-buildx-action@v3
            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - id: meta
              uses: docker/metadata-action@v5
              with:
                  # Registry names must be lowercase, the GitHub account name is not
                  images: ghcr.io/robzuk/symfony-erp
                  tags: |
                      type=sha,prefix=
                      type=raw,value=latest
            - uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
