security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        app_user_provider:
            entity:
                class: App\Identity\Entity\User
                property: email

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        # REST API for other systems (everything under /api except the documentation). Stateless:
        # no session and no cookie, every request carries its key in "Authorization: Bearer <key>".
        # A missing or wrong key gets 401 with "WWW-Authenticate: Bearer".
        api:
            pattern: ^/api(?!/doc)
            stateless: true
            entry_point: App\Identity\Security\ApiAuthenticationProblem
            access_token:
                token_handler: App\Identity\Security\ApiKeyHandler
                failure_handler: App\Identity\Security\ApiAuthenticationProblem
        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Identity\Security\UserChecker
            # An administrator can work as another user, to see what they see: ?_switch_user=<e-mail>,
            # and ?_switch_user=_exit to come back. The activity log keeps naming the administrator.
            switch_user:
                role: ROLE_ADMIN
            # After 5 failed sign-ins to one account from one address, further attempts are refused for 15 minutes.
            # One address is also limited across all accounts (5 times as many attempts), against guessing many logins.
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
            logout:
                path: app_logout
                enable_csrf: true

            # Activate different ways to authenticate:
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    # Job roles are assigned to users; the *_EDIT permissions are what the code checks.
    role_hierarchy:
        ROLE_ADMIN: [ROLE_WAREHOUSE, ROLE_SALES, ROLE_ACCOUNTING]
        ROLE_WAREHOUSE: [ROLE_CATALOG_EDIT, ROLE_INVENTORY_EDIT]
        ROLE_SALES: [ROLE_CATALOG_EDIT, ROLE_PARTNER_EDIT, ROLE_SALES_EDIT]
        ROLE_ACCOUNTING: [ROLE_PARTNER_EDIT, ROLE_INVOICING_EDIT]

    # Everything except the login page requires a signed-in user.
    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        # Swagger UI and the OpenAPI description, so that whoever integrates can read them without a key
        - { path: ^/api/doc, roles: PUBLIC_ACCESS }
        # Each endpoint also checks the scope it needs (#[IsGranted('ROLE_API_...')])
        - { path: ^/api, roles: ROLE_API }
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
