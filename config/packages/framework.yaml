# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    # Sessions are kept in Redis, so every running copy of the app sees the same sign-ins.
    # Redis expires them by itself, at the lifetime set by session.gc_maxlifetime.
    session:
        # With the same timeouts as the cache (config/packages/cache.yaml)
        handler_id: '%env(REDIS_URL)%?timeout=2&read_timeout=2'

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
