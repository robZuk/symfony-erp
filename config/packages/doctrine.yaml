doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        # One mapping per module: entities live in src/<Module>/Entity
        mappings:
            Shared:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Shared/Entity'
                prefix: 'App\Shared\Entity'
            SharedAudit:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Shared/Audit'
                prefix: 'App\Shared\Audit'
            Identity:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Identity/Entity'
                prefix: 'App\Identity\Entity'
            Catalog:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Catalog/Entity'
                prefix: 'App\Catalog\Entity'
            Partner:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Partner/Entity'
                prefix: 'App\Partner\Entity'
            Inventory:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Inventory/Entity'
                prefix: 'App\Inventory\Entity'
            Sales:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Sales/Entity'
                prefix: 'App\Sales\Entity'
            Invoicing:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Invoicing/Entity'
                prefix: 'App\Invoicing\Entity'

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
