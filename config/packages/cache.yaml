framework:
    cache:
        # Unique name of your app: used to compute stable namespaces for cache keys.
        # Fixed, so every running copy of the app reads and writes the same keys.
        prefix_seed: system-erp

        # The "app" cache, which also holds the failed sign-in counts of login throttling,
        # is kept in PostgreSQL so that every running copy of the app shares it.
        app: cache.adapter.doctrine_dbal

        # Namespaced pools use the above "app" backend by default
        #pools:
            #my.dedicated.cache: null

when@test:
    framework:
        cache:
            # Tests run inside rolled-back database transactions; keep the cache out of them
            app: cache.adapter.filesystem
